name: CI/CD and Azure ML MLOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write


jobs:

  # -------------------------------------------------
  # 1. CONTINUOUS INTEGRATION
  # -------------------------------------------------

  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v


  # -------------------------------------------------
  # 2. TRAIN + QUALITY GATE + REGISTER + DEPLOY
  # -------------------------------------------------

  train-and-deploy:
    name: Train, register and deploy approved model

    needs: test

    # Pull requests run tests only.
    # Training and deployment run after a push to main
    # or a manual workflow run.
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # Repository
      # -------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------
      # Azure authentication
      # -------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # -------------------------------------------------
      # Azure ML CLI
      # -------------------------------------------------

      - name: Install Azure ML CLI
        run: |
          az extension add --name ml --yes


      # -------------------------------------------------
      # Submit Azure ML training job
      # -------------------------------------------------

      - name: Submit Azure ML training job
        run: |
          JOB_NAME=$(az ml job create \
            --file azureml/train-job.yml \
            --resource-group aml-flight-price-mlops \
            --workspace-name aml-flight-price-mlops \
            --query name \
            --output tsv)

          echo "JOB_NAME=$JOB_NAME" >> "$GITHUB_ENV"

          echo "Azure ML job submitted:"
          echo "$JOB_NAME"


      # -------------------------------------------------
      # Stream Azure ML job
      # -------------------------------------------------

      - name: Stream Azure ML job
        run: |
          az ml job stream \
            --name "$JOB_NAME" \
            --resource-group aml-flight-price-mlops \
            --workspace-name aml-flight-price-mlops


      # -------------------------------------------------
      # Verify training + quality gate
      # -------------------------------------------------

      - name: Verify training and quality gate
        run: |
          STATUS=$(az ml job show \
            --name "$JOB_NAME" \
            --resource-group aml-flight-price-mlops \
            --workspace-name aml-flight-price-mlops \
            --query status \
            --output tsv)

          echo "Final Azure ML job status: $STATUS"

          if [ "$STATUS" != "Completed" ]; then
            echo "Training or model quality gate failed."
            exit 1
          fi

          echo "Training completed and quality gate passed."


      # -------------------------------------------------
      # Determine next model version
      # -------------------------------------------------

      - name: Determine next model version
        run: |
          LATEST_VERSION=$(az ml model list \
            --name flight-price-model \
            --resource-group aml-flight-price-mlops \
            --workspace-name aml-flight-price-mlops \
            --query "[].version" \
            --output tsv | sort -n | tail -1)

          if [ -z "$LATEST_VERSION" ]; then
            NEXT_VERSION=1
          else
            NEXT_VERSION=$((LATEST_VERSION + 1))
          fi

          echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"

          echo "Current latest version: ${LATEST_VERSION:-None}"
          echo "New model version: $NEXT_VERSION"


      # -------------------------------------------------
      # Register approved model
      # -------------------------------------------------

      - name: Register approved model
        run: |
          az ml model create \
            --name flight-price-model \
            --version "$NEXT_VERSION" \
            --type custom_model \
            --path "azureml://jobs/$JOB_NAME/outputs/artifacts/paths/outputs/model/" \
            --description "Flight price model approved by automated CI and model quality gate." \
            --resource-group aml-flight-price-mlops \
            --workspace-name aml-flight-price-mlops

          echo "Registered flight-price-model version $NEXT_VERSION"


      # -------------------------------------------------
      # Prepare deployment YAML
      # -------------------------------------------------

      - name: Prepare deployment configuration
        run: |
          cp azureml/deployment.yml azureml/deployment-ci.yml

          sed -i "s/MODEL_VERSION/$NEXT_VERSION/g" azureml/deployment-ci.yml

          echo "Deployment configuration:"
          cat azureml/deployment-ci.yml


      # -------------------------------------------------
      # Ensure endpoint exists
      # -------------------------------------------------

      - name: Ensure online endpoint exists
        run: |
          if az ml online-endpoint show \
            --name flight-price-endpoint \
            --resource-group aml-flight-price-mlops \
            --workspace-name aml-flight-price-mlops \
            > /dev/null 2>&1; then

            echo "Online endpoint already exists."

          else

            echo "Online endpoint does not exist. Creating it."

            az ml online-endpoint create \
              --file azureml/endpoint.yml \
              --resource-group aml-flight-price-mlops \
              --workspace-name aml-flight-price-mlops

          fi


      # -------------------------------------------------
      # Create or update deployment
      # -------------------------------------------------

      - name: Deploy approved model
        run: |
          if az ml online-deployment show \
            --name blue \
            --endpoint-name flight-price-endpoint \
            --resource-group aml-flight-price-mlops \
            --workspace-name aml-flight-price-mlops \
            > /dev/null 2>&1; then

            echo "Updating blue deployment to model version $NEXT_VERSION."

            az ml online-deployment update \
              --name blue \
              --endpoint-name flight-price-endpoint \
              --file azureml/deployment-ci.yml \
              --resource-group aml-flight-price-mlops \
              --workspace-name aml-flight-price-mlops

          else

            echo "Creating blue deployment with model version $NEXT_VERSION."

            az ml online-deployment create \
              --name blue \
              --endpoint-name flight-price-endpoint \
              --file azureml/deployment-ci.yml \
              --resource-group aml-flight-price-mlops \
              --workspace-name aml-flight-price-mlops \
              --all-traffic

          fi


      # -------------------------------------------------
      # Ensure traffic goes to blue
      # -------------------------------------------------

      - name: Route traffic to blue deployment
        run: |
          az ml online-endpoint update \
            --name flight-price-endpoint \
            --traffic "blue=100" \
            --resource-group aml-flight-price-mlops \
            --workspace-name aml-flight-price-mlops

          echo "100% of endpoint traffic routed to blue."


      # -------------------------------------------------
      # Smoke test
      # -------------------------------------------------

      - name: Smoke test online endpoint
        run: |
          RESPONSE=$(az ml online-endpoint invoke \
            --name flight-price-endpoint \
            --deployment-name blue \
            --request-file sample-request.json \
            --resource-group aml-flight-price-mlops \
            --workspace-name aml-flight-price-mlops)

          echo "Endpoint response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q "predictions"; then
            echo "Smoke test passed."
          else
            echo "Smoke test failed."
            exit 1
          fi